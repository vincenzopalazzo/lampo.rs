[workspace]
members = [
        "lampo-common",
        "lampo-plugin-common",
        "lampo-plugin",
        "plugin-sdk/rust",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-lnd",
        "lampo-testing",
        "tests/tests",
        "lampo-chain",
        "lampo-bdk-wallet"
]

default-members = [
        "lampo-common",
        "lampo-plugin-common",
        "lampo-plugin",
        "plugin-sdk/rust",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-lnd",
        "lampo-chain",
        "lampo-bdk-wallet"
]
resolver = "2"

# `peer_storage` is an LDK rustc cfg, not a Cargo feature. Declaring it here
# keeps `-D unexpected_cfgs` / `-D warnings` from failing the compile_error
# guard in lampod when a build forgets `--cfg peer_storage`.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(peer_storage)',
] }

[workspace.lints.clippy]
# clippy is not part of `make fmt`; keep the table so rust lints inherit.

# LDK 0.3 is published to crates.io as a pre-release, so the requirement has to
# spell out `0.3.0-beta1`: a bare `0.3` does not match pre-release versions.
# Bump every lightning* crate together so the stack stays on one version
# (see issue #537).
[workspace.dependencies]
# All lightning* crates come from one git revision: the 0.3-rc2 tag plus the
# currency-conversion commit. Mixing this lightning crate with the crates.io
# rc2 crates builds two copies of lightning-types and the traits no longer match.
lightning = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "e8c981e71" }
lightning-block-sync = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "e8c981e71" }
lightning-persister = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "e8c981e71", features = ["tokio"] }
lightning-background-processor = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "e8c981e71" }
lightning-net-tokio = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "e8c981e71" }
lightning-rapid-gossip-sync = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "e8c981e71" }
