[workspace]
members = [
        "lampo-common",
        "lampo-plugin-common",
        "lampo-plugin",
        "plugin-sdk/rust",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-lnd",
        "lampo-testing",
        "tests/tests",
        "lampo-chain",
        "lampo-bdk-wallet",
        "lampo-phoenix"
]

default-members = [
        "lampo-common",
        "lampo-plugin-common",
        "lampo-plugin",
        "plugin-sdk/rust",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-lnd",
        "lampo-chain",
        "lampo-bdk-wallet",
        "lampo-phoenix"
]
resolver = "2"

# `peer_storage` is an LDK rustc cfg, not a Cargo feature. Listing it here
# lets `cfg!(peer_storage)` in `lampod/build.rs` compile without an
# `unexpected_cfgs` warning. A missing cfg fails that build script.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(peer_storage)',
] }



# LDK 0.3 is published to crates.io as a pre-release, so the requirement has to
# spell out `0.3.0-beta1`: a bare `0.3` does not match pre-release versions.
# Bump every lightning* crate together so the stack stays on one version
# (see issue #537).
[workspace.dependencies]
# All lightning* crates come from one git revision: the 0.3-rc2 tag plus the
# currency-conversion commit, plus Phoenix liquidity-ad TLVs on splice and
# init. Mixing this lightning crate with the crates.io rc2 crates builds two
# copies of lightning-types and the traits no longer match.
lightning = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "edffe4994a4f4f0dca397dfe3a61982b7324b3fc" }
lightning-block-sync = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "edffe4994a4f4f0dca397dfe3a61982b7324b3fc" }
lightning-persister = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "edffe4994a4f4f0dca397dfe3a61982b7324b3fc", features = ["tokio"] }
lightning-background-processor = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "edffe4994a4f4f0dca397dfe3a61982b7324b3fc" }
lightning-net-tokio = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "edffe4994a4f4f0dca397dfe3a61982b7324b3fc" }
lightning-rapid-gossip-sync = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "edffe4994a4f4f0dca397dfe3a61982b7324b3fc" }
