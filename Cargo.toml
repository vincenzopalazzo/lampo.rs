[workspace]
members = [
        "lampo-common",
        "lampo-plugin-common",
        "lampo-plugin",
        "plugin-sdk/rust",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-lnd",
        "lampo-testing",
        "tests/tests",
        "lampo-chain",
        "lampo-bdk-wallet"
]

default-members = [
        "lampo-common",
        "lampo-plugin-common",
        "lampo-plugin",
        "plugin-sdk/rust",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-lnd",
        "lampo-chain",
        "lampo-bdk-wallet"
]
resolver = "2"

# `peer_storage` is an LDK rustc cfg, not a Cargo feature. Listing it here
# lets `cfg!(peer_storage)` in `lampod/build.rs` compile without an
# `unexpected_cfgs` warning. A missing cfg fails that build script.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(peer_storage)',
] }



# LDK 0.3 is published to crates.io as a pre-release, so the requirement has to
# spell out `0.3.0-beta1`: a bare `0.3` does not match pre-release versions.
# Bump every lightning* crate together so the stack stays on one version
# (see issue #537).
[workspace.dependencies]
# All lightning* crates come from one git revision: the 0.3 contact stack
# plus ContactId (`lampo/blip42-contact-id-0.3`). Mixing this lightning crate
# with crates.io builds two copies of lightning-types.
lightning = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "2f1d1b140" }
lightning-block-sync = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "2f1d1b140" }
lightning-persister = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "2f1d1b140", features = ["tokio"] }
lightning-background-processor = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "2f1d1b140" }
lightning-net-tokio = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "2f1d1b140" }
lightning-rapid-gossip-sync = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "2f1d1b140" }
