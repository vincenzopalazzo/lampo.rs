[workspace]
members = [
        "lampo-common",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-testing",
        "tests/tests",
        "lampo-chain",
        "lampo-bdk-wallet"
]

default-members = [
        "lampo-common",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-chain",
        "lampo-bdk-wallet"
]
resolver = "2"

# LDK 0.3 is published to crates.io as a pre-release, so the requirement has to
# spell out `0.3.0-beta1`: a bare `0.3` does not match pre-release versions.
# Bump every lightning* crate together so the stack stays on one version
# (see issue #537).
[workspace.dependencies]
# WIP: BLIP-42 (Bolt 12 contacts) via vincenzopalazzo/rust-lightning@blip42-on-0.3
# crates.io 0.3.0-beta1 lacks OptionalOfferPaymentParams::{contact_secrets,payer_offer}.
# Pinned to the compact-payer-offer SCID fix so signet/mutinet offers stay <= 300 bytes.
lightning = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "1f889201a", package = "lightning" }
lightning-block-sync = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "1f889201a", package = "lightning-block-sync" }
lightning-persister = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "1f889201a", package = "lightning-persister", features = ["tokio"] }
lightning-background-processor = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "1f889201a", package = "lightning-background-processor" }
lightning-net-tokio = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "1f889201a", package = "lightning-net-tokio" }
lightning-rapid-gossip-sync = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "1f889201a", package = "lightning-rapid-gossip-sync" }
