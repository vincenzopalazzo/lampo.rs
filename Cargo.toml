[workspace]
members = [
        "lampo-common",
        "lampo-plugin-common",
        "lampo-plugin",
        "plugin-sdk/rust",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-lnd",
        "lampo-testing",
        "tests/tests",
        "lampo-chain",
        "lampo-bdk-wallet"
]

default-members = [
        "lampo-common",
        "lampo-plugin-common",
        "lampo-plugin",
        "plugin-sdk/rust",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-lnd",
        "lampo-chain",
        "lampo-bdk-wallet"
]
resolver = "2"

# LDK 0.3 is published to crates.io as a pre-release, so the requirement has to
# spell out `0.3.0-beta1`: a bare `0.3` does not match pre-release versions.
# Bump every lightning* crate together so the stack stays on one version
# (see issue #537).
[workspace.dependencies]
# All lightning* crates come from one git revision: 0.3-rc3 plus currency
# conversion, plus the BLIP-42 contact commits. Mixing this lightning crate
# with crates.io rc3 builds two copies of lightning-types.
lightning = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "0e790ca8c" }
lightning-block-sync = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "0e790ca8c" }
lightning-persister = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "0e790ca8c", features = ["tokio"] }
lightning-background-processor = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "0e790ca8c" }
lightning-net-tokio = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "0e790ca8c" }
lightning-rapid-gossip-sync = { git = "https://github.com/vincenzopalazzo/rust-lightning", rev = "0e790ca8c" }
