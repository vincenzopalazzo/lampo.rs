[workspace]
# lampo-spark-swapd is intentionally excluded: it pulls the Spark
# stack, roughly 160 crates lampo itself does not need, and must never
# be built by `cargo test --all` or audited by cargo-deny as part of
# the node. Build it explicitly with its own manifest path.
exclude = ["lampo-spark-swapd"]

members = [
        "lampo-common",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-testing",
        "tests/tests",
        "lampo-chain",
        "lampo-bdk-wallet"
]

default-members = [
        "lampo-common",
        "lampod",
        "lampod-cli",
        "lampo-cli",
        "lampo-httpd",
        "lampo-chain",
        "lampo-bdk-wallet"
]
resolver = "2"

# LDK 0.3 is published to crates.io as a pre-release, so the requirement has to
# spell out `0.3.0-beta1`: a bare `0.3` does not match pre-release versions.
# Bump every lightning* crate together so the stack stays on one version
# (see issue #537).
[workspace.dependencies]
lightning = "0.3.0-beta1"
lightning-block-sync = "0.3.0-beta1"
lightning-persister = { version = "0.3.0-beta1", features = ["tokio"] }
lightning-background-processor = "0.3.0-beta1"
lightning-net-tokio = "0.3.0-beta1"
lightning-rapid-gossip-sync = "0.3.0-beta1"
