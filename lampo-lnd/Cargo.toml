[package]
name = "lampo-lnd"
version = "0.1.0"
edition = "2021"
description = "LND-compatible REST API surface for lampo (Zeus remote node)"
publish = false

[dependencies]
actix-web = { version = "4", features = ["rustls-0_23"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
lampo-common = { path = "../lampo-common" }
lampod = { path = "../lampod" }
log = "0.4"
pbjson = "0.7"
pbjson-types = "0.7"
prost = "0.13"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
tokio-rustls = "0.26"

[build-dependencies]
pbjson-build = "0.7"
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
actix-rt = "2"
tempfile = "3"
