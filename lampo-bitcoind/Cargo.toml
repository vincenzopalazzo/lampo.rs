[package]
name = "lampo-bitcoind"
version = "0.1.0"
edition = "2021"
description = "Default bitcoind chain backend plugin shipped with lampo"

[dependencies]
lampo-plugin-sdk = { path = "../lampo-plugin-sdk" }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
log = { version = "0.4", features = ["std"] }
