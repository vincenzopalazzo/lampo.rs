## Lampo configuration example. Uncomment
## all the fields that you are interested in
## and set your bitcoin core information.

# type of backend that it is used
# Backend supported: bitcoin core (aka core)
backend=core

# bitcoin rpc url
core-url=http://127.0.0.1:38332

# bitcoin rpc user
core-user=lampo
# bitcoin rpc password
core-pass=lampo

# Level of the log level, default to info
# log-level=trace

# Log file where the information about the
# execution are stored
# log-file=/home/vincent/.lampo/signescorer

# The bitcoin network
# network=signet

# The port where lampo will listen about p2p connection
# port=39736

# Enable development sync mode (syncs every second instead of every 2 minutes)
# Only use this for development/testing purposes
# dev-sync=true

# Wallet sync start height.
#
# A newly generated wallet jumps to the chain tip by default so it does not
# scan from block 0. A mnemonic restore never takes this automatic jump, even
# with a new height-0 database, because the seed may own historical funds.
#
# To force a full genesis scan of a brand-new wallet, set:
# fast-sync=false
#
# To jump to a specific birthday height instead of the tip (any wallet), set:
# reindex=307000

# Async payments (BOLT 12 static invoices, experimental).
#
# Role of this node: `client` asks the next hop to hold outbound HTLCs so the
# node can go offline right after sending; `server` holds HTLCs and serves
# static invoices on behalf of often-offline recipients.
# async-payments-role=client
#
# Often-offline recipient setup: hex-encoded blinded paths obtained
# from the static invoice server's `asyncinvoicepaths` RPC (or written
# here). Once set, the `offer` command returns the async receive offer
# instead of a direct one. The same hex can be applied at runtime with
# `setasyncinvoicepaths`.
#
# `asyncinvoicepaths` takes an operator-chosen `recipient_id` (hex). Use
# unique high-entropy bytes per recipient; the server keys the invoice
# store by sha256(recipient_id).
# async-invoice-server-paths=<hex>
