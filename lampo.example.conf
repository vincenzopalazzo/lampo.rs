## Lampo configuration example. Uncomment
## all the fields that you are interested in
## and set your bitcoin core information.

# type of backend that it is used
# Backend supported: bitcoin core (aka core)
backend=core

# bitcoin rpc url
core-url=http://127.0.0.1:38332

# bitcoin rpc user
core-user=lampo
# bitcoin rpc password
core-pass=lampo

# Level of the log level, default to info
# log-level=trace

# Log file where the information about the
# execution are stored
# log-file=/home/vincent/.lampo/signescorer

# The bitcoin network
# network=signet

# The port where lampo will listen about p2p connection
# port=39736

# Enable development sync mode (syncs every second instead of every 2 minutes)
# Only use this for development/testing purposes
# dev-sync=true

# Wallet sync start height.
#
# A newly generated wallet jumps to the chain tip by default so it does not
# scan from block 0. A mnemonic restore never takes this automatic jump, even
# with a new height-0 database, because the seed may own historical funds.
#
# To force a full genesis scan of a brand-new wallet, set:
# fast-sync=false
#
# To jump to a specific birthday height instead of the tip (any wallet), set:
# reindex=307000

# Where the node keeps its state. Defaults to `fs`, LDK's filesystem store
# under the node directory.
# storage=fs

# `sqlite` keeps it in one database file instead. Without storage-url the file
# is lampo.db inside the node directory.
# storage=sqlite
# storage-url=/home/vincent/.lampo/testnet/lampo.db

# `postgres` needs a connection string. High availability is the database's
# job: point this at a primary with a synchronous replica. Only ever run one
# node against a given database.
# storage=postgres
# storage-url=postgres://lampo:secret@127.0.0.1:5432/lampo

# Keep a shadow copy of the node state on a VSS server, so a node that loses
# its database can be rebuilt. Mirroring runs in the background and never
# blocks a payment, so the copy can lag behind the primary.
# vss-url=https://vss.example.com
