## Lampo configuration example. Uncomment
## all the fields that you are interested in
## and set your bitcoin core information.

# type of backend that it is used
# Backend supported: bitcoin core (aka core)
backend=core

# bitcoin rpc url
core-url=http://127.0.0.1:38332

# bitcoin rpc user
core-user=lampo
# bitcoin rpc password
core-pass=lampo

# Level of the log level, default to info
# log-level=trace

# Log file where the information about the
# execution are stored
# log-file=/home/vincent/.lampo/signescorer

# The bitcoin network
# network=signet

# The port where lampo will listen about p2p connection
# port=39736
# Listen host. Not announced. Unset means no LN listener.
# bind-addr=127.0.0.1
# Public address in the node announcement. A public IP, DNS name, or
# .onion. Loopback and private ranges are rejected. Unset means the
# node does not advertise an address.
# announce-addr=1.1.1.1

# Serve the LND-compatible API instead of lampo-httpd for remote wallets like Zeus.
# Requires lampod-cli to be built with `--features lnd`.
# Writes tls.cert/tls.key and admin.macaroon under <datadir>/<network>/lnd-rest/.
# Uses api-host and api-port for its listener.
# Macaroons have no expiry yet; rotate by deleting lnd-rest/macaroons/ carefully.
# lnd=true
# api-host=127.0.0.1
# api-port=7979
# Add the LAN DNS name or IP used by remote clients when api-host is a wildcard.
# Repeat this setting for multiple certificate identities.
# lnd-tls-san=lampo-node.local
# lnd-tls-san=192.168.1.10

# Enable development sync mode (syncs every second instead of every 2 minutes)
# Only use this for development/testing purposes
# dev-sync=true

# Wallet sync start height.
#
# A newly generated wallet jumps to the chain tip by default so it does not
# scan from block 0. A mnemonic restore never takes this automatic jump, even
# with a new height-0 database, because the seed may own historical funds.
#
# To force a full genesis scan of a brand-new wallet, set:
# fast-sync=false
#
# To jump to a specific birthday height instead of the tip (any wallet), set:
# reindex=307000

# Async payments (BOLT 12 static invoices, experimental).
#
# Disabled by default: without a role or recipient paths this node ignores
# async-payment onion messages and does not hold HTLCs.
#
# Role of this node: `client` asks the next hop to hold outbound HTLCs so the
# node can go offline right after sending; `server` holds HTLCs and serves
# static invoices on behalf of often-offline recipients.
# async-payments-role=client
#
# Often-offline recipient setup: hex-encoded blinded paths obtained
# from the static invoice server's `asyncinvoicepaths` RPC (or written
# here). Once set, the `offer` command returns the async receive offer
# instead of a direct one. The same hex can be applied at runtime with
# `setasyncinvoicepaths`.
#
# `asyncinvoicepaths` takes the recipient's node id. That node must
# already be a channel counterparty; the server keys the invoice store
# by sha256(compressed pubkey).
# async-invoice-server-paths=<hex>
#
# Optional token required by `asyncinvoicepaths` and
# `setasyncinvoicepaths` when set. Other RPCs stay unauthenticated
# (localhost plus the HTTP DNS-rebinding guard).
# api-token=<secret>

# BOLT 12 currency-denominated offers (ISO 4217 minor units).
#
# Lampo does not fetch an exchange rate. List the rates this node will sign
# and pay, as `CODE=msats_per_minor_unit` (USD cents, JPY yen), comma
# separated. An offer priced in a missing code is rejected.
#
# LDK 0.3.0-rc2 still rejects currency amounts inside ChannelManager
# (rust-lightning#3833 is closed, not merged). These rates are applied by
# lampo when creating or paying an offer. Once that hook lands, the same
# table is what we pass as CurrencyConversion.
# currency-rates=USD=1000,EUR=1100
# Symmetric slack around each rate, in basis points (100 = 1%). Must be
# below 10000. Default is 100.
# currency-tolerance-bps=100

# ACINQ Phoenix LSP client (experimental).
#
# Node id and address of the Phoenix LSP as NODE_ID@HOST:PORT, or `default`
# for ACINQ's node on testnet3 or mainnet. When set, lampo dials it at
# startup, keeps the connection alive, advertises on-the-fly funding
# (bit 561), funding fee credit (bit 563) and zero reserve channels
# (bit 129) to that peer only, and answers `phoenixlsp-info`,
# `phoenixlsp-dnsaddress` and `phoenixlsp-recordpurchase`. Unset leaves the
# handler idle.
# phoenix-lsp=default
#
# Liquidity policy for the LSP's on-the-fly funding proposals. Today lampo
# only decides and logs; it does not buy liquidity yet.
#
# Inbound liquidity to request when a payment does not fit, in sat. Unset
# rejects every proposal.
# phoenix-auto-liquidity=2000000
#
# Fee credit the LSP may keep for payments too small to pay their own
# funding fee, in sat. Default 0.
# phoenix-max-fee-credit=50000
#
# Maximum funding fee relative to the amount received, in basis points.
# Default 250 (2.5%).
# phoenix-max-relative-fee-bps=250
#
# Maximum mining fee of a funding transaction, in sat. Required to accept
# any proposal once phoenix-auto-liquidity is set.
# phoenix-max-mining-fee=20000
