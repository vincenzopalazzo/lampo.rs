[package]
name = "lampo-httpd"
version = "0.1.0"
edition = "2021"

[dependencies]
# Omit default `http2` (and unused `ws`): http2 pulls h2 0.3.x, which is
# affected by RUSTSEC-2026-0258, and actix has not moved to the patched
# h2 >= 0.4.16 line yet. lampo-httpd only serves HTTP/1.1 REST locally.
actix-web = { version = "4", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
] }
paperclip = { version = "0.9.5", features = ["actix4"] }
log = "*"
paste = "1.0.15"
serde = "*"
tokio = { version = "1", features = ["rt"] }

lampo-common = { path = "../lampo-common" }
lampod = { path = "../lampod" }

# FIXME: this should be optional
elite-rpc =  { version = "0.0.4", features = ["curl"] }
