[package]
name = "lampo-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "SDK for writing lampo plugins in Rust"

[dependencies]
lampo-plugin-common = { path = "../../lampo-plugin-common" }
lampo-plugin = { path = "../../lampo-plugin", features = ["grpc"] }
# actix-rt 2.14 made `net` and `signal` optional. The bitcoind example
# pulls actix-server 2.7, which still imports them. lampo-lnd enables
# the features, but this package does not depend on lampo-lnd, so
# `cargo build --example lampo-bitcoind` never sees that flag.
actix-rt = { version = "2.15", features = ["net", "signal"] }
tokio = { version = "1", features = ["io-util", "io-std", "sync", "rt", "macros", "net", "signal"] }
tonic = { version = "0.13", features = ["transport"] }
futures-core = "0.3"
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = { version = "0.4", features = ["std"] }

[[example]]
name = "lampo-bitcoind"
path = "examples/bitcoind.rs"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
