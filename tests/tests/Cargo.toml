[package]
name = "tests"
version = "0.1.0"
edition = "2021"

[features]
# Run the VLS-backed node tests; needs VLSD_EXE and REMOTE_HSMD_SOCKET_EXE.
vls = ["lampo-testing/vls"]

[dependencies]
lampo-common = { path = "../../lampo-common" }
lampo-testing = { path = "../../lampo-testing" }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros"] }
tokio-test-shutdown-timeout = "0.0.2"
ntest = "0.9.0"
serde_json = "1"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }