name: Integration testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 1 1,15 * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chain: [core, rbitcoin]
    steps:
      - uses: actions/checkout@v2
      - name: lampo integration testing (${{ matrix.chain }})
        run: |
          docker build -f docker/Dockerfile -t lampo-ci-ubuntu .
          docker run -e LAMPO_CHAIN_BACKEND=${{ matrix.chain }} lampo-ci-ubuntu
